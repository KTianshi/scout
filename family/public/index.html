<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f3ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16191b" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Lookout</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%232f6f62'/%3E%3Cpath d='M16 7l7 3v5c0 5-3 8.5-7 10-4-1.5-7-5-7-10v-5z' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f7f3ec;
  --surface: #ffffff;
  --surface-2: #f1ece3;
  --text: #22282b;
  --muted: #69716f;
  --line: #e5ded2;
  --accent: #2f6f62;
  --accent-ink: #ffffff;
  --accent-soft: #e2efe9;
  --ok: #2f8a5b;
  --warn: #b7791f;
  --shadow: 0 1px 2px rgba(40,30,10,.06), 0 4px 16px rgba(40,30,10,.06);

  --t-scam: #c4483b;      --t-scam-bg: #fbe9e5;
  --t-remote: #7a4fb0;    --t-remote-bg: #efe7f8;
  --t-pay: #b36b00;       --t-pay-bg: #fcf0d9;
  --t-help: #2e6fae;      --t-help-bg: #e3eef9;
  --t-info: #4f7a6c;      --t-info-bg: #e5efea;

  --approve: #2f8a5b;
  --deny: #c4483b;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #16191b;
    --surface: #1f2427;
    --surface-2: #272d31;
    --text: #ecebe7;
    --muted: #a0a7a5;
    --line: #313a3e;
    --accent: #6cc2ad;
    --accent-ink: #0f1d19;
    --accent-soft: #1e3530;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    --t-scam: #f08a7c;   --t-scam-bg: #3a2420;
    --t-remote: #b99ae6; --t-remote-bg: #2d2540;
    --t-pay: #f0b55a;    --t-pay-bg: #3a2e18;
    --t-help: #82b6ea;   --t-help-bg: #1d2e40;
    --t-info: #8fc0ae;   --t-info-bg: #1f302a;
    --approve: #3da26d;
    --deny: #d75a4c;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 17px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  min-height: 100vh;
}
button, textarea, input { font: inherit; color: inherit; }
button { cursor: pointer; }
.wrap { max-width: 640px; margin: 0 auto; padding: 0 16px; }

/* Header */
header.top {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  -webkit-backdrop-filter: saturate(1.4) blur(14px);
  backdrop-filter: saturate(1.4) blur(14px);
  border-bottom: 1px solid var(--line);
  padding-top: env(safe-area-inset-top);
}
.head-row { display: flex; align-items: center; gap: 12px; padding: 14px 0 10px; }
.logo {
  width: 40px; height: 40px; border-radius: 12px; flex: none;
  background: var(--accent); color: var(--accent-ink);
  display: grid; place-items: center;
}
.logo svg { width: 22px; height: 22px; }
.head-text { flex: 1; min-width: 0; }
.head-text h1 { font-size: 20px; line-height: 1.2; margin: 0; font-weight: 700; letter-spacing: -.01em; }
.status { display: flex; align-items: center; gap: 6px; font-size: 13.5px; color: var(--muted); margin-top: 2px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: #a9a9a9; flex: none; }
.dot.on { background: #33b06f; box-shadow: 0 0 0 0 rgba(51,176,111,.5); animation: pulse 2.4s infinite; }
.dot.off { background: #d9a02b; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(51,176,111,.45);} 70% { box-shadow: 0 0 0 7px rgba(51,176,111,0);} 100% { box-shadow: 0 0 0 0 rgba(51,176,111,0);} }
.sound-btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 6px 10px; font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center;
}
.sound-btn svg { width: 16px; height: 16px; }
.sound-btn.on { color: var(--accent); }
@media (max-width: 420px) { .sound-btn { padding: 8px; } .sound-btn span { display: none; } }

/* Tabs */
nav.tabs { display: flex; gap: 6px; padding: 0 0 12px; }
.tab {
  flex: 1; border: 0; background: var(--surface-2); color: var(--muted);
  padding: 9px 8px; border-radius: 12px; font-size: 15px; font-weight: 600;
  display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 42px;
}
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.badge {
  min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; font-size: 12px; font-weight: 700;
  background: var(--t-scam); color: #fff; display: inline-grid; place-items: center;
}
.badge[hidden] { display: none; }

main.wrap { padding-top: 16px; padding-bottom: calc(40px + env(safe-area-inset-bottom)); }
section[hidden] { display: none; }

/* Banner */
.banner {
  position: fixed; left: 50%; transform: translate(-50%, -140%);
  top: calc(env(safe-area-inset-top) + 10px);
  width: min(608px, calc(100% - 24px)); z-index: 50;
  background: var(--t-scam); color: #fff; border-radius: 18px; padding: 14px 16px;
  box-shadow: 0 10px 30px rgba(0,0,0,.25);
  display: flex; gap: 12px; align-items: flex-start;
  transition: transform .35s cubic-bezier(.2,.9,.3,1.2);
}
.banner.show { transform: translate(-50%, 0); }
.banner.remote_access { background: #6d43a6; }
.banner.payment_pause { background: #a85f00; }
.banner .b-icon { width: 36px; height: 36px; border-radius: 10px; background: rgba(255,255,255,.2); display: grid; place-items: center; flex: none; }
.banner .b-icon svg { width: 20px; height: 20px; }
.banner .b-body { flex: 1; min-width: 0; }
.banner .b-kicker { font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; opacity: .9; }
.banner .b-title { font-weight: 700; font-size: 17px; line-height: 1.3; margin-top: 1px; }
.banner .b-cta { margin-top: 8px; display: flex; gap: 8px; }
.banner button { border: 0; border-radius: 10px; padding: 7px 12px; font-size: 14px; font-weight: 600; background: #fff; color: #222; }
.banner button.ghost { background: rgba(255,255,255,.18); color: #fff; }

/* Cards */
.feed { display: flex; flex-direction: column; gap: 12px; }
.card {
  background: var(--surface); border-radius: 18px; padding: 14px 14px 14px;
  box-shadow: var(--shadow); border: 1px solid var(--line);
  display: grid; grid-template-columns: 40px 1fr; gap: 12px;
}
.card.fresh { animation: fresh 1.4s ease-out; }
@keyframes fresh { 0% { transform: scale(.97); box-shadow: 0 0 0 3px var(--accent);} 100% { transform: none; } }
.ticon { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; }
.ticon svg { width: 21px; height: 21px; }
.scam_alert .ticon { background: var(--t-scam-bg); color: var(--t-scam); }
.remote_access .ticon { background: var(--t-remote-bg); color: var(--t-remote); }
.payment_pause .ticon { background: var(--t-pay-bg); color: var(--t-pay); }
.help .ticon { background: var(--t-help-bg); color: var(--t-help); }
.info .ticon { background: var(--t-info-bg); color: var(--t-info); }
.c-meta { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.c-kind { font-weight: 700; }
.scam_alert .c-kind { color: var(--t-scam); }
.remote_access .c-kind { color: var(--t-remote); }
.payment_pause .c-kind { color: var(--t-pay); }
.help .c-kind { color: var(--t-help); }
.info .c-kind { color: var(--t-info); }
.c-title { font-size: 17px; font-weight: 650; margin: 2px 0 4px; line-height: 1.3; overflow-wrap: anywhere; }
.c-expl { color: var(--text); opacity: .86; font-size: 15.5px; margin: 0; overflow-wrap: anywhere; }
.c-action {
  margin-top: 10px; display: inline-flex; align-items: center; gap: 6px;
  background: var(--accent-soft); color: var(--accent); font-weight: 600; font-size: 14px;
  padding: 5px 10px; border-radius: 999px;
}
.c-action svg { width: 15px; height: 15px; flex: none; }
.c-src { font-size: 13px; color: var(--muted); margin-top: 8px; overflow-wrap: anywhere; }
.c-src code { font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--surface-2); padding: 1px 5px; border-radius: 5px; }
.thumb {
  margin-top: 10px; display: block; padding: 0; border: 1px solid var(--line); background: var(--surface-2);
  border-radius: 12px; overflow: hidden; max-width: 100%; width: 220px; aspect-ratio: 16/10;
}
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.risk { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; padding: 1px 7px; border-radius: 999px; background: var(--t-scam-bg); color: var(--t-scam); }
.c-link { margin-top: 10px; }
.c-link button { border: 0; background: none; color: var(--accent); font-weight: 600; padding: 0; font-size: 15px; }

/* Approvals */
.sec-title { font-size: 14px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 22px 4px 10px; }
.sec-title:first-child { margin-top: 4px; }
.ap {
  background: var(--surface); border-radius: 22px; padding: 18px; border: 2px solid var(--t-pay);
  box-shadow: 0 8px 28px rgba(179,107,0,.16); margin-bottom: 14px;
}
.ap-kicker { display: flex; align-items: center; gap: 8px; color: var(--t-pay); font-weight: 700; font-size: 14px; }
.ap-kicker svg { width: 18px; height: 18px; }
.ap-amount { font-size: 40px; font-weight: 750; letter-spacing: -.02em; line-height: 1.1; margin: 10px 0 2px; }
.ap-payee { font-size: 17px; font-weight: 600; }
.ap-method { display: inline-block; margin-left: 6px; font-size: 13px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); vertical-align: 2px; }
.ap-method.hot { background: var(--t-scam-bg); color: var(--t-scam); }
.ap-title { font-size: 18px; font-weight: 650; margin: 12px 0 4px; }
.ap-expl { margin: 0; font-size: 15.5px; opacity: .88; }
.ap textarea {
  width: 100%; margin-top: 14px; border: 1px solid var(--line); background: var(--surface-2);
  border-radius: 12px; padding: 10px 12px; min-height: 48px; resize: vertical; font-size: 16px;
}
.ap textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.ap-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.big {
  border: 0; border-radius: 16px; min-height: 60px; font-size: 19px; font-weight: 700; color: #fff;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: transform .08s, filter .15s;
}
.big:active { transform: scale(.97); }
.big:disabled { filter: grayscale(.6) opacity(.6); }
.big svg { width: 22px; height: 22px; }
.big.deny { background: var(--deny); }
.big.approve { background: var(--approve); }
.ap-hint { font-size: 13.5px; color: var(--muted); margin-top: 10px; text-align: center; }
.ap-time { font-size: 13px; color: var(--muted); font-weight: 500; margin-left: auto; }

.decided { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; display: flex; gap: 12px; align-items: center; margin-bottom: 10px; }
.decided .pill { flex: none; font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 999px; }
.pill.approved { background: var(--t-info-bg); color: var(--ok); }
.pill.denied { background: var(--t-scam-bg); color: var(--t-scam); }
.pill.pending { background: var(--t-pay-bg); color: var(--t-pay); }
.decided .d-body { flex: 1; min-width: 0; }
.decided .d-title { font-weight: 600; font-size: 15.5px; overflow-wrap: anywhere; }
.decided .d-sub { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }

/* Week */
.hero {
  background: linear-gradient(160deg, var(--accent-soft), var(--surface));
  border: 1px solid var(--line); border-radius: 22px; padding: 20px; box-shadow: var(--shadow);
}
.hero .kicker { font-size: 13px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .07em; }
.hero h2 { font-size: 24px; line-height: 1.25; margin: 6px 0 0; letter-spacing: -.01em; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
.stat .n { font-size: 30px; font-weight: 750; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat .l { font-size: 14px; color: var(--muted); margin-top: 2px; }
.stat.s-scam .n { color: var(--t-scam); }
.stat.s-pay .n { color: var(--t-pay); }
.stat.s-help .n { color: var(--t-help); }
.stat.s-money .n { color: var(--ok); }
.chart { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px 14px 12px; margin-top: 14px; }
.chart h3 { margin: 0 0 12px; font-size: 15px; }
.bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; align-items: end; height: 130px; }
.bar-col { display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
.bar { width: 100%; max-width: 34px; border-radius: 8px; display: flex; flex-direction: column-reverse; overflow: hidden; background: var(--surface-2); min-height: 4px; }
.bar i { display: block; width: 100%; }
.bar-n { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar-l { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.bar-l.today { color: var(--accent); }
.legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.c-scam { background: var(--t-scam); } .c-remote { background: var(--t-remote); } .c-pay { background: var(--t-pay); } .c-help { background: var(--t-help); } .c-info { background: var(--t-info); }
.breakdown { margin-top: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 6px 14px; }
.breakdown div { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 15.5px; }
.breakdown div:last-child { border-bottom: 0; }
.breakdown b { font-variant-numeric: tabular-nums; }

/* Empty */
.empty { text-align: center; padding: 40px 24px; color: var(--muted); }
.empty .e-icon { width: 64px; height: 64px; margin: 0 auto 14px; border-radius: 20px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
.empty .e-icon svg { width: 32px; height: 32px; }
.empty h3 { color: var(--text); margin: 0 0 6px; font-size: 19px; }
.empty p { margin: 0 auto; max-width: 320px; font-size: 15.5px; }

/* Lightbox */
.lightbox { position: fixed; inset: 0; z-index: 60; background: rgba(10,12,14,.88); display: none; align-items: center; justify-content: center; padding: 20px; }
.lightbox.show { display: flex; }
.lightbox img { max-width: 100%; max-height: 85vh; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
.lightbox .close { position: absolute; top: calc(14px + env(safe-area-inset-top)); right: 14px; border: 0; width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.15); color: #fff; font-size: 24px; }

.toast { position: fixed; bottom: calc(20px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%) translateY(120px); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 15px; font-weight: 600; transition: transform .25s; z-index: 70; max-width: calc(100% - 32px); }
.toast.show { transform: translateX(-50%) translateY(0); }
.foot { text-align: center; color: var(--muted); font-size: 13px; margin-top: 28px; }

@media (min-width: 720px) {
  .stats { grid-template-columns: repeat(4, 1fr); }
  main.wrap { padding-top: 22px; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="head-row">
      <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l8 3.2v5.6c0 5.2-3.4 9.3-8 10.9-4.6-1.6-8-5.7-8-10.9V5.7z"/></svg></div>
      <div class="head-text">
        <h1 id="hTitle">Watching over Mom</h1>
        <div class="status"><span class="dot" id="dot"></span><span id="statusText">Connecting…</span></div>
      </div>
      <button class="sound-btn" id="soundBtn" type="button" aria-label="Turn on alert sound">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4z"/><path id="soundWaves" d="M15.5 8.5a5 5 0 010 7M18.5 5.5a9 9 0 010 13"/></svg>
        <span id="soundLabel">Sound off</span>
      </button>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="live" aria-selected="true">Live <span class="badge" id="liveBadge" hidden>0</span></button>
      <button class="tab" role="tab" data-tab="approvals" aria-selected="false">Approvals <span class="badge" id="apBadge" hidden>0</span></button>
      <button class="tab" role="tab" data-tab="week" aria-selected="false">This week</button>
    </nav>
  </div>
</header>

<div class="banner" id="banner" role="alert" aria-live="assertive">
  <div class="b-icon" id="bIcon"></div>
  <div class="b-body">
    <div class="b-kicker" id="bKicker">Lookout alert</div>
    <div class="b-title" id="bTitle"></div>
    <div class="b-cta"><button id="bView" type="button">View</button><button class="ghost" id="bDismiss" type="button">Dismiss</button></div>
  </div>
</div>

<main class="wrap">
  <section id="tab-live" role="tabpanel"><div class="feed" id="feed"></div></section>
  <section id="tab-approvals" role="tabpanel" hidden><div id="approvals"></div></section>
  <section id="tab-week" role="tabpanel" hidden><div id="week"></div></section>
  <div class="foot" id="foot">Lookout · keeping an eye out, so you don't have to</div>
</main>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Screenshot"><button class="close" aria-label="Close" type="button">×</button><img id="lbImg" alt="Screenshot from the Mac"></div>
<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';
  var API = '';
  var state = { events: [], approvals: [], summary: null, config: { elderName: 'Mom', familyName: 'Sarah' }, tab: 'live', unread: 0, connected: false };
  var ALERT_TYPES = { scam_alert: 1, remote_access: 1, payment_pause: 1 };

  var ICONS = {
    scam_alert: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9.5 16.5h-19z"/><path d="M12 10v4M12 17.2v.1"/></svg>',
    remote_access: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/><path d="M9.5 8.5l5 5M14.5 8.5l-5 5"/></svg>',
    payment_pause: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 10h19"/><path d="M15 14.5v2M18 14.5v2"/></svg>',
    help: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.3 9.3a2.8 2.8 0 015.4 1c0 1.9-2.7 2.4-2.7 4"/><path d="M12 17.3v.1"/></svg>',
    info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.8l7.5 3v5.4c0 4.8-3.2 8.6-7.5 10-4.3-1.4-7.5-5.2-7.5-10V5.8z"/><path d="M8.8 12.2l2.2 2.2 4.3-4.4"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    shield: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.8l7.5 3v5.4c0 4.8-3.2 8.6-7.5 10-4.3-1.4-7.5-5.2-7.5-10V5.8z"/></svg>',
    sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
    heart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0112 7a4.3 4.3 0 017.5 2.8C19.5 15.4 12 20 12 20z"/></svg>'
  };
  var KIND = { scam_alert: 'Scam stopped', remote_access: 'Remote access blocked', payment_pause: 'Payment paused', help: 'Help', info: 'Update' };

  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function safeImg(s) { return typeof s === 'string' && /^data:image\/(jpeg|jpg|png|webp|gif);base64,/.test(s) ? s : ''; }
  function ago(ts) {
    var s = Math.max(0, (Date.now() - ts) / 1000);
    if (s < 45) return 'just now';
    if (s < 90) return '1 min ago';
    if (s < 3600) return Math.round(s / 60) + ' min ago';
    if (s < 5400) return '1 hr ago';
    if (s < 86400) return Math.round(s / 3600) + ' hr ago';
    var d = new Date(ts), y = new Date(); y.setHours(0, 0, 0, 0);
    if (ts >= y.getTime() - 86400000) return 'Yesterday ' + d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    return d.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' }) + ', ' + d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  }
  function money(n, cur) {
    if (typeof n !== 'number') return n ? esc(n) : '';
    try { return n.toLocaleString(undefined, { style: 'currency', currency: cur || 'USD', maximumFractionDigits: n % 1 ? 2 : 0 }); }
    catch (e) { return '$' + n.toFixed(2); }
  }
  function getJSON(url, opts) {
    return fetch(API + url, opts).then(function (r) { return r.json().then(function (j) { if (!r.ok && !j.status) throw new Error(j.error || r.status); return j; }); });
  }
  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove('show'); }, 2600);
  }

  // ----- Sound -----
  var audioCtx = null, soundOn = false;
  try { soundOn = localStorage.getItem('lookout.sound') !== 'off'; } catch (e) { soundOn = true; }
  function unlockAudio() {
    if (!soundOn) return;
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) {}
    renderSoundBtn();
  }
  function audioReady() { return soundOn && audioCtx && audioCtx.state === 'running'; }
  function renderSoundBtn() {
    var on = audioReady();
    $('soundBtn').classList.toggle('on', on);
    $('soundLabel').textContent = on ? 'Sound on' : (soundOn ? 'Tap for sound' : 'Sound off');
    $('soundWaves').style.display = on ? '' : 'none';
  }
  function chime() {
    if (!audioReady()) return;
    var t = audioCtx.currentTime;
    [[659.25, 0], [880, 0.16], [1046.5, 0.32]].forEach(function (n) {
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = n[0];
      g.gain.setValueAtTime(0.0001, t + n[1]);
      g.gain.exponentialRampToValueAtTime(0.22, t + n[1] + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + n[1] + 0.55);
      o.connect(g).connect(audioCtx.destination);
      o.start(t + n[1]); o.stop(t + n[1] + 0.6);
    });
  }
  ['pointerdown', 'keydown', 'touchstart'].forEach(function (e) { window.addEventListener(e, unlockAudio, { passive: true }); });
  $('soundBtn').addEventListener('click', function () {
    if (audioReady()) { soundOn = false; }
    else { soundOn = true; unlockAudio(); setTimeout(chime, 50); }
    try { localStorage.setItem('lookout.sound', soundOn ? 'on' : 'off'); } catch (e) {}
    renderSoundBtn();
  });

  // ----- Title / unread -----
  function updateTitle() {
    var pending = state.approvals.filter(function (a) { return a.status === 'pending'; }).length;
    var n = state.unread;
    document.title = (n ? '(' + n + ') ' : '') + 'Lookout · ' + state.config.elderName;
    var lb = $('liveBadge'); lb.hidden = !n; lb.textContent = n;
    var ab = $('apBadge'); ab.hidden = !pending; ab.textContent = pending;
  }
  function clearUnread() { if (document.visibilityState === 'visible' && state.tab === 'live' && state.unread) { setTimeout(function () { state.unread = 0; updateTitle(); }, 1200); } }
  document.addEventListener('visibilitychange', clearUnread);

  // ----- Tabs -----
  function setTab(t) {
    state.tab = t;
    document.querySelectorAll('.tab').forEach(function (b) { b.setAttribute('aria-selected', b.dataset.tab === t ? 'true' : 'false'); });
    ['live', 'approvals', 'week'].forEach(function (k) { $('tab-' + k).hidden = k !== t; });
    if (t === 'week') loadSummary();
    if (t === 'live') clearUnread();
    try { history.replaceState(null, '', '#' + t); } catch (e) {}
    window.scrollTo({ top: 0 });
  }
  document.querySelectorAll('.tab').forEach(function (b) { b.addEventListener('click', function () { setTab(b.dataset.tab); }); });

  // ----- Render: feed -----
  function cardHTML(e) {
    var meta = '<span class="c-kind">' + esc(KIND[e.type] || 'Update') + '</span><span>·</span><span class="ago" data-ts="' + e.ts + '">' + esc(ago(e.ts)) + '</span>';
    if (typeof e.risk === 'number' && e.risk >= 0.7 && e.type !== 'info' && e.type !== 'help') meta += '<span class="risk" title="Risk ' + Math.round(e.risk * 100) + '%">High risk</span>';
    var src = [];
    if (e.app) src.push('in ' + esc(e.app));
    if (e.url) src.push('<code>' + esc(e.url.replace(/^https?:\/\//, '').slice(0, 60)) + '</code>');
    var img = safeImg(e.screenshot);
    var html = '<article class="card ' + esc(e.type) + '" data-id="' + esc(e.id) + '">' +
      '<div class="ticon">' + (ICONS[e.type] || ICONS.info) + '</div><div>' +
      '<div class="c-meta">' + meta + '</div>' +
      '<h3 class="c-title">' + esc(e.title) + '</h3>' +
      (e.explanation ? '<p class="c-expl">' + esc(e.explanation) + '</p>' : '') +
      (src.length ? '<div class="c-src">' + src.join(' · ') + '</div>' : '') +
      (img ? '<button class="thumb" type="button" data-img="' + esc(e.id) + '" aria-label="View screenshot"><img src="' + img + '" alt="Screenshot" loading="lazy"></button>' : '') +
      (e.action ? '<div><span class="c-action">' + ICONS.check + esc(e.action) + '</span></div>' : '');
    if (e.approvalId) {
      var ap = state.approvals.find(function (a) { return a.id === e.approvalId; });
      if (ap && ap.status === 'pending') html += '<div class="c-link"><button type="button" data-goto="approvals">Review this payment →</button></div>';
      else if (ap) html += '<div class="c-src"><span class="pill ' + ap.status + '" style="font-weight:700">' + (ap.status === 'approved' ? 'You approved it' : 'You denied it') + '</span></div>';
    }
    return html + '</div></article>';
  }
  function emptyHTML(icon, title, text) {
    return '<div class="empty"><div class="e-icon">' + ICONS[icon] + '</div><h3>' + esc(title) + '</h3><p>' + esc(text) + '</p></div>';
  }
  function renderFeed(freshId) {
    var el = $('feed');
    if (!state.events.length) {
      el.innerHTML = emptyHTML('sun', 'All quiet so far', "Lookout is keeping an eye on " + state.config.elderName + "'s Mac. If anything looks off, you'll see it here right away.");
      return;
    }
    el.innerHTML = state.events.map(cardHTML).join('');
    if (freshId) { var c = el.querySelector('[data-id="' + freshId + '"]'); if (c) c.classList.add('fresh'); }
  }

  // ----- Render: approvals -----
  var drafts = {};
  function renderApprovals() {
    var el = $('approvals');
    // keep note drafts
    el.querySelectorAll('textarea[data-note]').forEach(function (t) { drafts[t.dataset.note] = t.value; });
    var pending = state.approvals.filter(function (a) { return a.status === 'pending'; });
    var decided = state.approvals.filter(function (a) { return a.status !== 'pending'; });
    var html = '';
    if (pending.length) {
      html += '<div class="sec-title">Waiting for you</div>';
      html += pending.map(function (a) {
        var hot = /gift|wire|crypto|bitcoin|zelle|western/i.test(a.method || '');
        var img = safeImg(a.screenshot);
        return '<div class="ap" data-ap="' + esc(a.id) + '">' +
          '<div class="ap-kicker">' + ICONS.payment_pause + '<span>' + esc(state.config.elderName) + ' is trying to pay</span><span class="ap-time ago" data-ts="' + a.ts + '">' + esc(ago(a.ts)) + '</span></div>' +
          (a.amount != null ? '<div class="ap-amount">' + money(a.amount, a.currency) + '</div>' : '') +
          ((a.payee || a.method) ? '<div class="ap-payee">' + (a.payee ? 'to ' + esc(a.payee) : '') + (a.method ? '<span class="ap-method' + (hot ? ' hot' : '') + '">' + esc(a.method) + '</span>' : '') + '</div>' : '') +
          '<div class="ap-title">' + esc(a.title) + '</div>' +
          (a.explanation ? '<p class="ap-expl">' + esc(a.explanation) + '</p>' : '') +
          (img ? '<button class="thumb" type="button" data-apimg="' + esc(a.id) + '" aria-label="View screenshot"><img src="' + img + '" alt="Screenshot"></button>' : '') +
          '<textarea data-note="' + esc(a.id) + '" rows="2" placeholder="Add a note for ' + esc(state.config.elderName) + ' (optional)">' + esc(drafts[a.id] || '') + '</textarea>' +
          '<div class="ap-btns"><button class="big deny" type="button" data-decide="deny" data-id="' + esc(a.id) + '">' + ICONS.x + 'Deny</button>' +
          '<button class="big approve" type="button" data-decide="approve" data-id="' + esc(a.id) + '">' + ICONS.check + 'Approve</button></div>' +
          '<div class="ap-hint">The payment stays paused until you decide.</div></div>';
      }).join('');
    } else {
      html += emptyHTML('shield', 'Nothing waiting on you', "If " + state.config.elderName + " starts a risky payment, Lookout will pause it and ask you here first.");
    }
    if (decided.length) {
      html += '<div class="sec-title">Decided</div>';
      html += decided.map(function (a) {
        var sub = [a.amount != null ? money(a.amount, a.currency) : '', a.payee ? esc(a.payee) : '', a.decidedAt ? esc(ago(a.decidedAt)) : ''].filter(Boolean).join(' · ');
        return '<div class="decided"><span class="pill ' + esc(a.status) + '">' + (a.status === 'approved' ? 'Approved' : 'Denied') + '</span>' +
          '<div class="d-body"><div class="d-title">' + esc(a.title) + '</div><div class="d-sub">' + sub + '</div>' +
          (a.note ? '<div class="d-sub">“' + esc(a.note) + '”</div>' : '') + '</div></div>';
      }).join('');
    }
    el.innerHTML = html;
  }
  function decide(id, action, btn) {
    var ta = document.querySelector('textarea[data-note="' + id + '"]');
    var note = ta ? ta.value.trim() : '';
    var box = btn.closest('.ap');
    box.querySelectorAll('button.big').forEach(function (b) { b.disabled = true; });
    getJSON('/api/approvals/' + encodeURIComponent(id) + '/' + action, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(note ? { note: note } : {}) })
      .then(function (r) {
        delete drafts[id];
        applyApproval(Object.assign({}, findApproval(id), r));
        toast(action === 'approve' ? 'Approved. ' + state.config.elderName + ' can go ahead.' : 'Denied. The payment was stopped.');
        if (navigator.vibrate) try { navigator.vibrate(30); } catch (e) {}
      })
      .catch(function (e) { toast('Could not send — check your connection.'); box.querySelectorAll('button.big').forEach(function (b) { b.disabled = false; }); });
  }
  function findApproval(id) { return state.approvals.find(function (a) { return a.id === id; }) || { id: id }; }
  function applyApproval(ap) {
    var i = state.approvals.findIndex(function (a) { return a.id === ap.id; });
    if (i >= 0) state.approvals[i] = Object.assign({}, state.approvals[i], ap); else state.approvals.unshift(ap);
    renderApprovals(); renderFeed(); updateTitle();
    if (state.tab === 'week') loadSummary();
  }

  // ----- Render: week -----
  function loadSummary() { getJSON('/api/summary').then(function (s) { state.summary = s; renderWeek(); }).catch(function () {}); }
  function renderWeek() {
    var s = state.summary, el = $('week');
    if (!s) { el.innerHTML = ''; return; }
    var max = Math.max(1, Math.max.apply(null, s.perDay.map(function (d) { return d.total; })));
    var order = [['scam_alert', 'c-scam'], ['remote_access', 'c-remote'], ['payment_pause', 'c-pay'], ['help', 'c-help'], ['info', 'c-info']];
    var bars = s.perDay.map(function (d, i) {
      var h = Math.round((d.total / max) * 100);
      var segs = order.map(function (o) { var c = d.counts[o[0]] || 0; return c ? '<i class="' + o[1] + '" style="height:' + (c / Math.max(1, d.total) * 100) + '%"></i>' : ''; }).join('');
      return '<div class="bar-col"><span class="bar-n">' + (d.total || '') + '</span><div class="bar" style="height:' + Math.max(4, h * 0.82) + '%">' + segs + '</div><span class="bar-l' + (i === 6 ? ' today' : '') + '">' + esc(i === 6 ? 'Today' : d.label) + '</span></div>';
    }).join('');
    var p = s.payments;
    el.innerHTML =
      '<div class="hero"><div class="kicker">Last 7 days</div><h2>' + esc(s.headline) + '</h2></div>' +
      '<div class="stats">' +
        '<div class="stat s-scam"><div class="n">' + s.scamsStopped + '</div><div class="l">Scams stopped</div></div>' +
        '<div class="stat s-pay"><div class="n">' + p.paused + '</div><div class="l">Payments paused</div></div>' +
        '<div class="stat s-help"><div class="n">' + s.helpSessions + '</div><div class="l">Times helped</div></div>' +
        '<div class="stat s-money"><div class="n">' + (s.moneyProtected ? money(s.moneyProtected) : '$0') + '</div><div class="l">Money kept safe</div></div>' +
      '</div>' +
      '<div class="chart"><h3>Day by day</h3><div class="bars">' + bars + '</div>' +
        '<div class="legend"><span><i class="c-scam"></i>Scam</span><span><i class="c-remote"></i>Remote access</span><span><i class="c-pay"></i>Payment</span><span><i class="c-help"></i>Help</span><span><i class="c-info"></i>Update</span></div></div>' +
      '<div class="breakdown">' +
        '<div><span>Scam warnings</span><b>' + s.countsByType.scam_alert + '</b></div>' +
        '<div><span>Remote access blocked</span><b>' + s.countsByType.remote_access + '</b></div>' +
        '<div><span>Payments you approved</span><b>' + p.approved + '</b></div>' +
        '<div><span>Payments you denied</span><b>' + p.denied + '</b></div>' +
        (p.pending ? '<div><span>Still waiting on you</span><b style="color:var(--t-pay)">' + p.pending + '</b></div>' : '') +
        '<div><span>Questions ' + esc(state.config.elderName) + ' asked</span><b>' + s.helpSessions + '</b></div>' +
      '</div>';
  }

  // ----- Banner -----
  var bannerTimer = null, bannerTarget = 'live';
  function showBanner(ev) {
    var b = $('banner');
    b.className = 'banner ' + ev.type;
    $('bIcon').innerHTML = ICONS[ev.type] || ICONS.info;
    $('bKicker').textContent = ev.type === 'payment_pause' ? 'Needs your OK' : (ev.type === 'remote_access' ? 'Lookout blocked this' : 'Lookout stopped a scam');
    $('bTitle').textContent = ev.title;
    bannerTarget = ev.type === 'payment_pause' ? 'approvals' : 'live';
    $('bView').textContent = ev.type === 'payment_pause' ? 'Review' : 'View';
    requestAnimationFrame(function () { b.classList.add('show'); });
    clearTimeout(bannerTimer);
    bannerTimer = setTimeout(hideBanner, ev.type === 'payment_pause' ? 20000 : 9000);
  }
  function hideBanner() { $('banner').classList.remove('show'); }
  $('bDismiss').addEventListener('click', hideBanner);
  $('bView').addEventListener('click', function () { hideBanner(); setTab(bannerTarget); });

  // ----- Delegated clicks -----
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-img],[data-apimg],[data-decide],[data-goto]');
    if (!t) return;
    if (t.dataset.decide) return decide(t.dataset.id, t.dataset.decide, t);
    if (t.dataset.goto) return setTab(t.dataset.goto);
    var src = '';
    if (t.dataset.img) { var ev = state.events.find(function (x) { return x.id === t.dataset.img; }); src = ev && safeImg(ev.screenshot); }
    if (t.dataset.apimg) { var ap = findApproval(t.dataset.apimg); src = safeImg(ap.screenshot); }
    if (src) { $('lbImg').src = src; $('lightbox').classList.add('show'); }
  });
  $('lightbox').addEventListener('click', function () { $('lightbox').classList.remove('show'); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { $('lightbox').classList.remove('show'); hideBanner(); } });

  // ----- Live updates -----
  function setConnected(on) {
    state.connected = on;
    $('dot').className = 'dot ' + (on ? 'on' : 'off');
    $('statusText').textContent = on ? 'Connected · live' : 'Reconnecting…';
  }
  function onNewEvent(ev) {
    if (state.events.some(function (x) { return x.id === ev.id; })) return;
    state.events.unshift(ev);
    if (state.events.length > 300) state.events.length = 300;
    var hidden = document.visibilityState !== 'visible' || state.tab !== 'live';
    if (ALERT_TYPES[ev.type] || hidden) state.unread++;
    renderFeed(ev.id);
    if (ALERT_TYPES[ev.type]) {
      showBanner(ev);
      chime();
      if (navigator.vibrate) try { navigator.vibrate([180, 90, 180]); } catch (e) {}
    }
    updateTitle();
    if (state.tab === 'week') loadSummary();
    if (!hidden) clearUnread();
  }
  var es = null, retry = 1000;
  function connect() {
    if (es) try { es.close(); } catch (e) {}
    es = new EventSource(API + '/api/stream');
    es.onopen = function () {
      var wasDown = !state.connected;
      setConnected(true); retry = 1000;
      if (wasDown && connect._everOpened) loadAll(); // resync after outage
      connect._everOpened = true;
    };
    es.addEventListener('event', function (m) { try { onNewEvent(JSON.parse(m.data)); } catch (e) {} });
    es.addEventListener('approval', function (m) { try { applyApproval(JSON.parse(m.data)); } catch (e) {} });
    es.addEventListener('reload', function () { state.unread = 0; loadAll(); });
    es.onerror = function () {
      setConnected(false);
      if (es.readyState === EventSource.CLOSED) { setTimeout(connect, retry); retry = Math.min(retry * 2, 15000); }
    };
  }

  function loadAll() {
    return Promise.all([getJSON('/api/events?limit=200'), getJSON('/api/approvals')]).then(function (r) {
      state.events = r[0]; state.approvals = r[1];
      renderFeed(); renderApprovals(); updateTitle();
      if (state.tab === 'week') loadSummary();
    }).catch(function () {});
  }

  setInterval(function () {
    document.querySelectorAll('.ago[data-ts]').forEach(function (n) { n.textContent = ago(+n.dataset.ts); });
  }, 30000);

  getJSON('/api/config').then(function (c) { state.config = c; }).catch(function () {}).then(function () {
    $('hTitle').textContent = 'Watching over ' + state.config.elderName;
    $('foot').textContent = 'Lookout · keeping an eye out for ' + state.config.elderName + ', so you can relax, ' + state.config.familyName + '.';
    renderSoundBtn();
    var initial = (location.hash || '').slice(1);
    setTab(['live', 'approvals', 'week'].indexOf(initial) >= 0 ? initial : 'live');
    loadAll().then(function () {
      if (state.approvals.some(function (a) { return a.status === 'pending'; }) && !initial) setTab('approvals');
    });
    connect();
  });
})();
</script>
</body>
</html>
